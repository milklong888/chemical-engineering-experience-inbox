<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350">
<title>共同储槽：来源、回流与最终净产品边界</title>
<desc>条件化局部结构候选，未Aspen验证。HP与LP凝液入共同槽，混合后返回HP或成为最终净产品。同一HX热冷两侧仅传热，不交换物料。</desc>
<defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#183449"/></marker><marker id="q" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#bb671c"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:22px;fill:#183449}.sm{font-size:19px}.bold{font-weight:700}.title{font-size:34px;font-weight:700}.heat{fill:#bb671c}</style>
<rect width="1800" height="1350" fill="#f4f7fa"/>

<text x="48" y="58" class="title">04  共同储槽：来源、回流与最终净边界</text>
<text x="48" y="101" class="">入槽凝液 C_HP / C_LP 不是全岛最终净产品；R_HP来自槽内混合液，其组成须另核。</text>
<text x="48" y="138" class="sm">局部接口 · 条件化结构候选 · 未Aspen验证  |  未证明实际边界流量闭合、设备能力或产品指标</text>
<rect x="30" y="165" width="1740" height="725" rx="16" fill="#edf2f6" stroke="#d3dfe7"/>
<rect x="650" y="190" width="190" height="85" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="745.0" y="224.5" class="bold" text-anchor="middle">LP顶部总汽</text>
<text x="745.0" y="256.5" class="sm" text-anchor="middle">V · 去冷凝服务</text>
<rect x="920" y="190" width="260" height="85" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="1050.0" y="224.5" class="bold" text-anchor="middle">LP顶部冷凝服务</text>
<text x="1050.0" y="256.5" class="sm" text-anchor="middle">冷凝 / 内部回流分配</text>
<path d="M840,232 L920,232" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="870" y="215" class="sm">V</text>
<rect x="1430" y="190" width="300" height="85" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="1580.0" y="224.5" class="bold" text-anchor="middle">LP内部液体回流</text>
<text x="1580.0" y="256.5" class="sm" text-anchor="middle">L → LP顶部返回</text>
<path d="M1180,232 L1430,232" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="1210" y="215" class="sm">L · 内部回流</text>
<rect x="50" y="310" width="230" height="90" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="165.0" y="347.0" class="bold" text-anchor="middle">HP顶部总顶汽</text>
<text x="165.0" y="379.0" class="sm" text-anchor="middle">V_HP · V</text>
<rect x="400" y="310" width="240" height="90" rx="12" fill="#e5f2f7" stroke="#176784" stroke-width="2"/>
<text x="520.0" y="347.0" class="bold" text-anchor="middle">HX-DE 热侧</text>
<text x="520.0" y="379.0" class="sm" text-anchor="middle">给定条件下凝液 C_HP</text>
<path d="M280,355 L400,355" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="330" y="338" class="sm">V</text>
<rect x="920" y="355" width="260" height="200" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="1050.0" y="415.0" class="bold" text-anchor="middle">共同储槽</text>
<text x="1050.0" y="447.0" class="sm" text-anchor="middle">接收 / 混合 / 必要分相</text>
<text x="1050.0" y="479.0" class="sm" text-anchor="middle">所选控制体：本槽</text>
<text x="1050.0" y="511.0" class="sm" text-anchor="middle">非指定Aspen模块名</text>
<path d="M640,355 L790,355 L790,390 L920,390" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="666" y="333" class="sm">C_HP · 入槽液 L</text>
<path d="M1050,275 L1050,355" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="1080" y="315" class="sm">C_LP · 入槽液 L</text>
<rect x="650" y="460" width="190" height="78" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="745.0" y="491.0" class="bold" text-anchor="middle">可选外供液 E</text>
<text x="745.0" y="523.0" class="sm" text-anchor="middle">岛外来源 · L</text>
<path d="M840,499 L920,499" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<rect x="1430" y="340" width="300" height="90" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="1580.0" y="377.0" class="bold" text-anchor="middle">R_HP · 混合回流 L</text>
<text x="1580.0" y="409.0" class="sm" text-anchor="middle">→ 所需供压 → HP顶部</text>
<path d="M1180,390 L1285,390 L1285,385 L1430,385" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<rect x="1430" y="470" width="300" height="80" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="1580.0" y="502.0" class="bold" text-anchor="middle">D_NET · 最终净产品</text>
<text x="1580.0" y="534.0" class="sm" text-anchor="middle">→ 所选系统外产品边界</text>
<path d="M1180,455 L1285,455 L1285,510 L1430,510" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<rect x="1430" y="585" width="300" height="85" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="1580.0" y="619.5" class="bold" text-anchor="middle">排气 / 排污边界</text>
<text x="1580.0" y="651.5" class="sm" text-anchor="middle">若存在：组成、相态另列</text>
<path d="M1180,520 L1250,520 L1250,627 L1430,627" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="1268" y="570" class="sm">真实外排，不默认为零</text>
<rect x="50" y="675" width="230" height="90" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="165.0" y="712.0" class="bold" text-anchor="middle">LP底部总抽液</text>
<text x="165.0" y="744.0" class="sm" text-anchor="middle">L_LP · L</text>
<rect x="400" y="675" width="240" height="90" rx="12" fill="#e5f2f7" stroke="#176784" stroke-width="2"/>
<text x="520.0" y="712.0" class="bold" text-anchor="middle">HX-DE 冷侧</text>
<text x="520.0" y="744.0" class="sm" text-anchor="middle">L → V+L · 受热</text>
<rect x="760" y="675" width="230" height="90" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="875.0" y="712.0" class="bold" text-anchor="middle">FLASH2-K</text>
<text x="875.0" y="744.0" class="sm" text-anchor="middle">釜式平衡分相近似</text>
<path d="M280,720 L400,720" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="330" y="704" class="sm">L</text>
<path d="M640,720 L760,720" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="674" y="704" class="sm">V+L</text>
<rect x="1330" y="700" width="400" height="80" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="1530.0" y="732.0" class="bold" text-anchor="middle">V_LP · V → LP下部汽相返回</text>
<text x="1530.0" y="764.0" class="sm" text-anchor="middle">核返回压力及真实接收位置</text>
<rect x="1330" y="805" width="400" height="65" rx="12" fill="white" stroke="#9bafbf" stroke-width="2"/>
<text x="1530.0" y="845.5" class="bold" text-anchor="middle">B_LP · L → 指定净底产品边界</text>
<path d="M990,705 L1130,705 L1130,740 L1330,740" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="1170" y="724" class="sm">V</text>
<path d="M990,746 L1080,746 L1080,837 L1330,837" stroke="#183449" stroke-width="3" fill="none" marker-end="url(#f)"/>
<text x="1170" y="820" class="sm">L</text>
<path d="M520,400 L520,675" stroke="#bb671c" stroke-width="3" fill="none" marker-end="url(#q)" stroke-dasharray="8 7"/>
<text x="548" y="585" class="sm heat">同一 HX-DE：仅传热 Q回收</text>
<text x="548" y="620" class="sm heat">不跨壁交换物料；不是两台HX</text>
<rect x="30" y="915" width="1740" height="145" rx="16" fill="#edf2f6" stroke="#d3dfe7"/>
<text x="52" y="957" class="bold">共同槽总账（同一质量流率基准；仅列结构关系，未填实际流量）</text>
<text x="52" y="1002" class="bold">C_HP + C_LP + E = R_HP + D_NET + 排气/排污 + 积累率</text>
<text x="52" y="1037" class="sm">稳态才令积累率为零；还须逐组分闭合。入槽液与回流不能重复计作最终净产品。</text>
<rect x="30" y="1080" width="1740" height="210" rx="16" fill="#edf2f6" stroke="#d3dfe7"/>
<text x="52" y="1120" class="bold">范围外服务与条件</text>
<text x="52" y="1158" class="sm">HP底：指定净产品或跨塔边界；HP再沸：外部供热。LP顶冷凝：外部冷却；原料入口另列。</text>
<text x="52" y="1192" class="sm">槽压、凝液降压闪蒸、排气去向、回流液相与供压须核；图中纯液入槽条件不代表降压后必然不闪蒸。</text>
<text x="52" y="1226" class="sm">混合回流不能继续当作原HP凝液；须核槽内相平衡/混合组成及对两塔产品与热负荷的影响。</text>
<text x="52" y="1260" class="sm">FLASH2仅分相时不另加隐含供热；本图未核面积、持液、槽控、温差、压降、热水力或Aspen端口。</text>
