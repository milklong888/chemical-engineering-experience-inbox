name: Validate inbox tooling
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Run deterministic admission checks
        run: python -B -m unittest discover -s tests -v
      - name: Run ordinary-pool parser regression
        run: python -B -m unittest discover -s pool/scripts/aspen-evidence/tests -v
      - name: Run ordinary-pool local artifact delivery checks
        run: python -B -X utf8 -m unittest discover -s pool/scripts/local-artifact-delivery/tests -v
      - name: Run isolated exported-data audit reference checks
        run: python -B -X utf8 -m unittest discover -s archive/2026-10-22/smr-psa-audit-tools/tests -v
      - name: Run portable convergence diagnostics checks
        run: python -B -X utf8 -m unittest discover -s pool/scripts/convergence-diagnostics/tests -v
      - name: Run native-layout offline graphics checks
        run: python -B -X utf8 -m unittest discover -s pool/scripts/aspen-native-layout/tests -v
